<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Eymen Aktaş — developer from Istanbul">
  <title>Eymen Aktaş — developer from Istanbul</title>
  <defs>
    <radialGradient id="k1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff5b4a" stop-opacity=".55"/><stop offset="1" stop-color="#ff5b4a" stop-opacity="0"/></radialGradient>
    <radialGradient id="k2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff8a7a" stop-opacity=".35"/><stop offset="1" stop-color="#ff8a7a" stop-opacity="0"/></radialGradient>
    <radialGradient id="k3" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#bb2a2a" stop-opacity=".28"/><stop offset="1" stop-color="#bb2a2a" stop-opacity="0"/></radialGradient>
    <linearGradient id="ad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#d6e4ff"/><stop offset="1" stop-color="#ff8a7a"/></linearGradient>
    <linearGradient id="kenar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5b4a" stop-opacity=".9"/><stop offset=".5" stop-color="#1f2733"/><stop offset="1" stop-color="#ff8a7a" stop-opacity=".7"/></linearGradient>
    <pattern id="izgara" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
    <clipPath id="kirp"><rect width="900" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    .ad{font:700 60px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;letter-spacing:-1.5px}
    .alt{font:500 15px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;letter-spacing:4px;text-transform:uppercase}
    .satir{font:500 19px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6edf3;opacity:0;animation:satir 12.8s linear infinite}
    .imlec{animation:yanip 1s steps(1) infinite}
    .y1{animation:suzul 14s ease-in-out infinite alternate}
    .y2{animation:suzul 18s ease-in-out infinite alternate-reverse}
    .y3{animation:suzul 22s ease-in-out infinite alternate}
    @keyframes satir{0%{opacity:0;transform:translateY(8px)}3%{opacity:1;transform:none}22.00%{opacity:1;transform:none}25.000%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
    @keyframes yanip{50%{opacity:0}}
    @keyframes suzul{from{transform:translate(0,0)}to{transform:translate(60px,-24px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.ilk{opacity:1!important}}
  </style>
  <g clip-path="url(#kirp)">
    <rect width="900" height="300" fill="#0d1117"/>
    <ellipse class="y1" cx="170" cy="60" rx="320" ry="200" fill="url(#k1)"/>
    <ellipse class="y2" cx="760" cy="250" rx="300" ry="190" fill="url(#k2)"/>
    <ellipse class="y3" cx="620" cy="10" rx="220" ry="140" fill="url(#k3)"/>
    <rect width="900" height="300" fill="url(#izgara)"/>
  </g>
  <rect x=".75" y=".75" width="898.5" height="298.5" rx="19.25" fill="none" stroke="url(#kenar)" stroke-width="1.5"/>

  <g>
    <text x="450" y="112" class="ad" fill="url(#ad)" text-anchor="middle">Eymen Aktaş</text>
  </g>
  <g>
    <text x="450" y="150" class="alt" fill="#8b949e" text-anchor="middle">Developer · Istanbul · Akts Studio</text>
    <rect x="220" y="182" width="460" height="48" rx="12" fill="#000" fill-opacity=".35" stroke="#1f2733"/>
    <circle cx="240" cy="206" r="4" fill="#f28b82" fill-opacity=".8"/>
    <circle cx="254" cy="206" r="4" fill="#fdd663" fill-opacity=".8"/>
    <circle cx="268" cy="206" r="4" fill="#81c995" fill-opacity=".8"/>
    <text x="450" y="214" class="satir ilk" style="animation-delay:0.0s" text-anchor="middle"><tspan fill="#ff8a7a">$</tspan> I run my own servers.</text>
    <text x="450" y="214" class="satir" style="animation-delay:3.2s" text-anchor="middle"><tspan fill="#ff8a7a">$</tspan> I train my own models.</text>
    <text x="450" y="214" class="satir" style="animation-delay:6.4s" text-anchor="middle"><tspan fill="#ff8a7a">$</tspan> I build what I want to use.</text>
    <text x="450" y="214" class="satir" style="animation-delay:9.6s" text-anchor="middle"><tspan fill="#ff8a7a">$</tspan> Measure, don't guess.</text>
  </g>
</svg>
