# Katkı grafiğini yiyen yılan animasyonunu üretir.
#
# Çıktı `output` dalına yazılıyor; README oradan okuyor. Böylece main
# dalı her gün gereksiz commit almıyor.
name: Snake

on:
  schedule:
    - cron: "0 3 * * *"   # her gece 03:00 UTC
  workflow_dispatch:       # elle de tetiklenebilsin
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
