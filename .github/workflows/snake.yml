# Katkı grafiğini yiyen yılan animasyonunu üretir.
#
# Çıktı `output` dalına yazılıyor; README oradan okuyor. Böylece main
# dalı her gün gereksiz commit almıyor.
name: Profil görselleri

on:
  schedule:
    - cron: "0 3 * * *"   # her gece 03:00 UTC
  workflow_dispatch:       # elle de tetiklenebilsin
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # İstatistik kartlarını KENDİMİZ üretiyoruz — üçüncü taraf servisler
      # (github-readme-stats, profile-trophy) 503/402 verdi ve bir ayna
      # 200 dönüp içerik olarak hata kartı çizdi. Kendi token'ımızla
      # ürettiğimizde ne rate limit oluyor ne de servis ölüyor.
      - name: İstatistik kartları
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: node scripts/istatistik.mjs dist

      # Aktivite grafiği de aynı sebeple kendi ürettiğimiz:
      # github-readme-activity-graph.vercel.app 2026-08-27'de
      # 402 "Payment required / DEPLOYMENT_DISABLED" vermeye başladı.
      - name: Aktivite grafiği
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: node scripts/aktivite.mjs dist

      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
