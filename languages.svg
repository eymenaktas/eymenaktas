<svg width="300" height="240" viewBox="0 0 300 240"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most used languages">
  <style>
    .b { font: 600 16px 'Segoe UI', Ubuntu, sans-serif; fill: #ff5b4a }
    .e { font: 500 13px 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9 }
    .d { font: 700 13px 'Segoe UI', Ubuntu, sans-serif; fill: #ff8a7a }
    .k { font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e }
    /* Kartlar yüklenirken belirsin — hepsi aynı anda parlıyor */
    .g { opacity: 0; animation: ac .6s ease forwards }
    @keyframes ac { to { opacity: 1 } }
  </style>
  <rect x="1" y="1" width="298" height="238" rx="12"
        fill="#0d1117" stroke="#1f2733" />
  <text x="24" y="34" class="b">Most used languages</text>
  <clipPath id="yuvarlak"><rect x="24" y="52" width="252" height="8" rx="4" /></clipPath>
     <g clip-path="url(#yuvarlak)">
       <rect x="24" y="52" width="252" height="8" fill="#1f2733" />
       <rect x="24.0" y="52" width="138.8" height="8" fill="#3178c6" /><rect x="162.8" y="52" width="42.0" height="8" fill="#3572A5" /><rect x="204.8" y="52" width="26.3" height="8" fill="#e34c26" /><rect x="231.1" y="52" width="25.7" height="8" fill="#663399" /><rect x="256.8" y="52" width="14.9" height="8" fill="#f1e05a" /><rect x="271.7" y="52" width="2.6" height="8" fill="#DA5B0B" />
     </g>
     <g class="g" style="animation-delay:0ms">
      <circle cx="29" cy="82" r="5" fill="#3178c6" />
      <text x="42" y="86" class="e">TypeScript</text>
      <text x="132" y="86" class="k" text-anchor="end">55.1%</text>
    </g>
<g class="g" style="animation-delay:70ms">
      <circle cx="161" cy="82" r="5" fill="#3572A5" />
      <text x="174" y="86" class="e">Python</text>
      <text x="264" y="86" class="k" text-anchor="end">16.7%</text>
    </g>
<g class="g" style="animation-delay:140ms">
      <circle cx="29" cy="106" r="5" fill="#e34c26" />
      <text x="42" y="110" class="e">HTML</text>
      <text x="132" y="110" class="k" text-anchor="end">10.4%</text>
    </g>
<g class="g" style="animation-delay:210ms">
      <circle cx="161" cy="106" r="5" fill="#663399" />
      <text x="174" y="110" class="e">CSS</text>
      <text x="264" y="110" class="k" text-anchor="end">10.2%</text>
    </g>
<g class="g" style="animation-delay:280ms">
      <circle cx="29" cy="130" r="5" fill="#f1e05a" />
      <text x="42" y="134" class="e">JavaScript</text>
      <text x="132" y="134" class="k" text-anchor="end">5.9%</text>
    </g>
<g class="g" style="animation-delay:350ms">
      <circle cx="161" cy="130" r="5" fill="#DA5B0B" />
      <text x="174" y="134" class="e">Jupyter Notebook</text>
      <text x="264" y="134" class="k" text-anchor="end">1.0%</text>
    </g>
</svg>