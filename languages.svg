<svg width="300" height="240" viewBox="0 0 300 240"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most used languages">
  <style>
    .b { font: 600 16px 'Segoe UI', Ubuntu, sans-serif; fill: #1a73e8 }
    .e { font: 500 13px 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9 }
    .d { font: 700 13px 'Segoe UI', Ubuntu, sans-serif; fill: #8ab4f8 }
    .k { font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e }
    /* Kartlar yüklenirken belirsin — hepsi aynı anda parlıyor */
    .g { opacity: 0; animation: ac .6s ease forwards }
    @keyframes ac { to { opacity: 1 } }
  </style>
  <rect x="1" y="1" width="298" height="238" rx="12"
        fill="#0d1117" stroke="#1f2733" />
  <text x="24" y="34" class="b">Most used languages</text>
  <clipPath id="yuvarlak"><rect x="24" y="52" width="252" height="8" rx="4" /></clipPath>
     <g clip-path="url(#yuvarlak)">
       <rect x="24" y="52" width="252" height="8" fill="#1f2733" />
       <rect x="24.0" y="52" width="105.8" height="8" fill="#b07219" /><rect x="129.8" y="52" width="83.4" height="8" fill="#3178c6" /><rect x="213.3" y="52" width="32.6" height="8" fill="#3572A5" /><rect x="245.8" y="52" width="13.3" height="8" fill="#663399" /><rect x="259.1" y="52" width="9.1" height="8" fill="#e34c26" /><rect x="268.2" y="52" width="6.1" height="8" fill="#f1e05a" />
     </g>
     <g class="g" style="animation-delay:0ms">
      <circle cx="29" cy="82" r="5" fill="#b07219" />
      <text x="42" y="86" class="e">Java</text>
      <text x="132" y="86" class="k" text-anchor="end">42.0%</text>
    </g>
<g class="g" style="animation-delay:70ms">
      <circle cx="161" cy="82" r="5" fill="#3178c6" />
      <text x="174" y="86" class="e">TypeScript</text>
      <text x="264" y="86" class="k" text-anchor="end">33.1%</text>
    </g>
<g class="g" style="animation-delay:140ms">
      <circle cx="29" cy="106" r="5" fill="#3572A5" />
      <text x="42" y="110" class="e">Python</text>
      <text x="132" y="110" class="k" text-anchor="end">12.9%</text>
    </g>
<g class="g" style="animation-delay:210ms">
      <circle cx="161" cy="106" r="5" fill="#663399" />
      <text x="174" y="110" class="e">CSS</text>
      <text x="264" y="110" class="k" text-anchor="end">5.3%</text>
    </g>
<g class="g" style="animation-delay:280ms">
      <circle cx="29" cy="130" r="5" fill="#e34c26" />
      <text x="42" y="134" class="e">HTML</text>
      <text x="132" y="134" class="k" text-anchor="end">3.6%</text>
    </g>
<g class="g" style="animation-delay:350ms">
      <circle cx="161" cy="130" r="5" fill="#f1e05a" />
      <text x="174" y="134" class="e">JavaScript</text>
      <text x="264" y="134" class="k" text-anchor="end">2.4%</text>
    </g>
</svg>